  <text x="92" y="522" class="body">Market Context • 1m</text>
  <text x="280" y="522" class="tiny">Designed for manual audit against the chart</text>

  <g>
    <rect x="92" y="548" width="278" height="110" rx="18" fill="#0E1B2C" stroke="#22425F"/>
    <text x="112" y="572" class="label">OVERVIEW</text>
    <text x="112" y="600" class="body">UPTREND • EXPANSION</text>
