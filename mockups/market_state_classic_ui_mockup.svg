<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111E"/>
      <stop offset="1" stop-color="#111C2B"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#122033"/>
      <stop offset="1" stop-color="#0B1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#49C2FF"/>
      <stop offset="1" stop-color="#80F6C6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #F5FAFF; }
      .label { font: 600 13px 'Segoe UI', sans-serif; fill: #8EA4BE; letter-spacing: 0.08em; }
      .body { font: 600 18px 'Segoe UI', sans-serif; fill: #F5FAFF; }
      .small { font: 500 14px 'Segoe UI', sans-serif; fill: #AAC0D8; }
      .tiny { font: 500 12px 'Segoe UI', sans-serif; fill: #7D93AC; }
      .chip { font: 700 12px 'Segoe UI', sans-serif; }
      .mono { font: 600 12px Consolas, monospace; fill: #D9E8F6; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>

  <text x="74" y="66" class="title">Classic Market Context UI Mockup</text>
  <text x="74" y="93" class="small">Compact strip + detail modal + chart audit preview for the new Market State rewrite</text>

  <g filter="url(#shadow)">
    <rect x="60" y="130" rx="26" ry="26" width="1480" height="280" fill="url(#panel)" stroke="#1D3148"/>
  </g>

  <text x="92" y="175" class="label">TOP STRIP / ACTIVE TIMEFRAME</text>
  <text x="92" y="206" class="body">Classic Market Context</text>
  <text x="310" y="206" class="tiny">1m active • compact view for the currently selected timeframe</text>

  <g>
    <rect x="1270" y="165" width="48" height="28" rx="14" fill="#123149" stroke="#214A66"/>
