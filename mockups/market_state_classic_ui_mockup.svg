  <g>
    <rect x="92" y="232" width="208" height="68" rx="16" fill="#0E1B2C" stroke="#22425F"/>
    <text x="112" y="255" class="label">TREND</text>
    <text x="112" y="284" class="body" fill="#87F3BF">UPTREND</text>
    <text x="112" y="306" class="tiny">Age 17 • confirmed HH/HL structure</text>

    <rect x="316" y="232" width="256" height="68" rx="16" fill="#0E1B2C" stroke="#22425F"/>
