  <text x="1080" y="522" class="body">Real Data Overlay</text>
  <text x="1236" y="522" class="tiny">for validation, not for trading decisions alone</text>

  <g>
    <rect x="1080" y="550" width="428" height="250" rx="18" fill="#08111B" stroke="#203248"/>
    <path d="M1115 747 C1170 698 1195 706 1232 664 C1268 624 1288 632 1320 596 C1356 554 1398 562 1456 590" stroke="#5BE3B0" stroke-width="4" fill="none"/>
    <path d="M1115 720 C1162 712 1190 704 1230 706 C1268 708 1298 696 1338 698 C1384 700 1424 690 1476 694" stroke="#4DBBFF" stroke-width="2" fill="none" stroke-dasharray="7 7"/>
    <circle cx="1232" cy="664" r="6" fill="#F5FAFF"/>
    <circle cx="1320" cy="596" r="6" fill="#F5FAFF"/>
    <circle cx="1198" cy="699" r="6" fill="#7BE8B7"/>
    <circle cx="1282" cy="631" r="6" fill="#7BE8B7"/>
    <line x1="1460" y1="566" x2="1460" y2="792" stroke="#2B425C" stroke-dasharray="6 6"/>
    <line x1="1165" y1="632" x2="1492" y2="632" stroke="#F7E38A" stroke-dasharray="6 6"/>
    <text x="1450" y="560" class="tiny">WATCH LONG</text>
    <text x="1170" y="626" class="tiny">base top</text>
    <text x="1188" y="653" class="tiny">HH</text>
    <text x="1272" y="620" class="tiny">HL</text>
    <text x="1312" y="586" class="tiny">HH</text>
  </g>

  <g>
    <rect x="1080" y="820" width="428" height="68" rx="18" fill="#0E1B2C" stroke="#22425F"/>
    <text x="1100" y="844" class="label">AUDIT LEGEND</text>
    <text x="1100" y="869" class="small">HH/HL markers • protected level • base boundaries • phase labels • breakout watch/confirm/fail markers</text>
  </g>

  <g>
    <rect x="1080" y="896" width="428" height="22" rx="11" fill="#0C1827" stroke="#1B3046"/>
    <text x="1100" y="911" class="tiny">Idea: UI should stay simple, but every state must be auditable on the chart with clear reasons.</text>
  </g>
</svg>
