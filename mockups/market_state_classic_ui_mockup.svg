  <g>
    <rect x="92" y="794" width="896" height="94" rx="18" fill="#0E1B2C" stroke="#22425F"/>
    <text x="112" y="818" class="label">AUDIT REASONS</text>
    <text x="112" y="844" class="small">1. Trend = UPTREND because confirmed HH/HL structure is active.</text>
    <text x="112" y="866" class="small">2. Phase = EXPANSION because price is extending with follow-through and the protected higher low is still intact.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1048" y="448" rx="26" ry="26" width="492" height="470" fill="url(#panel)" stroke="#1D3148"/>
