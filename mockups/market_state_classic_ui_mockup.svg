    <rect x="548" y="678" width="440" height="100" rx="18" fill="#0E1B2C" stroke="#22425F"/>
    <text x="568" y="702" class="label">VOLUME + PRICE ACTION</text>
    <text x="568" y="731" class="small">Volume: SUPPORTIVE  •  1.24x average</text>
    <text x="568" y="754" class="small">Pattern: impulse bar  •  close near high  •  no upper rejection</text>
