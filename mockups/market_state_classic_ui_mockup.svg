    <text x="406" y="600" class="small">Higher High: YES   Higher Low: YES</text>
    <text x="406" y="624" class="small">Lower High: NO    Lower Low: NO</text>
    <text x="406" y="648" class="small">Inside/Outside: NO / NO</text>

    <rect x="702" y="548" width="286" height="110" rx="18" fill="#0E1B2C" stroke="#22425F"/>
    <text x="722" y="572" class="label">PROTECTED LEVELS</text>
    <text x="722" y="600" class="small">Protected High: 67,120</text>
    <text x="722" y="624" class="small">Protected Low: 66,842</text>
    <text x="722" y="648" class="small">Base Top/Bottom: 67,110 / 66,910</text>
  </g>

  <g>
    <rect x="92" y="678" width="440" height="100" rx="18" fill="#0E1B2C" stroke="#22425F"/>
